name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend — tests + held-out eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run engine unit tests
        run: pytest -q

      - name: Run end-to-end pipeline (held-out metrics, no API key)
        run: python scripts/run_pipeline.py

      - name: Score the independent adversarial challenge suite
        run: python scripts/run_challenge.py

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and build
        working-directory: frontend
        run: |
          npm install
          npm run build
