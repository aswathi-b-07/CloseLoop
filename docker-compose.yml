# One command to run the whole system:  docker compose up --build
#   backend   → http://localhost:8000  (API docs at /docs)
#   dashboard → http://localhost:5173
#
# The system runs with NO API key (Tier-3 + Q&A degrade to a human-review
# fallback). To enable the Gemini tiers, put a free GEMINI_API_KEY in a .env
# file (see .env.example) before `docker compose up`.
services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Passed through from your shell / .env if set; blank is fine.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CLOSELOOP_MODEL=${CLOSELOOP_MODEL:-gemini-3.6-flash}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: node:22-alpine
    working_dir: /app
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      # The browser talks to the backend on the host, so localhost:8000 is correct.
      - VITE_API_BASE=http://localhost:8000
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run build && npm run preview -- --host 0.0.0.0 --port 5173"
